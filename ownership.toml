# SHARED FILE: who may edit what (master plan §12.4). Enforced by `cargo auricle wp check-paths`.
#
# Work packages own the paths listed in their own spec (`crate` plus optional `paths`) under
# work/packages/. This file lists everything that belongs to a role instead of a WP.
# A path matches if it equals a pattern or starts with a pattern that ends in "/".

[roles.pr-manager]
description = "Sole editor of shared files. Applies change requests in batches."
paths = [
  "Cargo.toml", "rust-toolchain.toml", "rustfmt.toml", "clippy.toml",
  "deny.toml", "ownership.toml", ".cargo/", ".github/", "AGENTS.md", "CLAUDE.md",
  "CHANGELOG.md", "BREAKING.md", "LICENSE.md", "LICENSES/", "parity/ledger.schema.json",
  "work/wp.schema.json", "agents/", "README.md", "book.toml", "CONTRIBUTING.md",
  "docs/agents/envelope.schema.json", "docs/SUMMARY.md", "docs/README.md",
]

[roles.spec-room]
description = "Writes WP specs, waves and parity scenarios. Never reads JUCE source."
paths = ["work/packages/", "work/waves/", "work/specs/", "parity/scenarios/", "docs/design/"]

[roles.contract-change]
description = "Only a contract-change WP approved by the adversarial verifier may touch these."
paths = ["contracts/"]

[roles.generated]
description = "Regenerated by the merge-queue job. Nobody commits these by hand."
paths = ["parity/ledger.json"]

# Paths any WP may touch in addition to its own crate.
[any-wp]
paths = ["Cargo.lock", "changes/", "errors/", "docs/guide/", "docs/cookbook/", "docs/migration/"]
