[package]
name = "syrp-strings"
description = "String utilities for Syrp with no std equivalent: Base64, StringPool, TextDiff and LocalisedStrings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only OR BUSL-1.1"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.syrp]
layer = "L2"
wp = "WP-1.1-13"

[dependencies]
syrp-error = { version = "0.0.1", path = "../../foundation/error" }

[dev-dependencies]
proptest = { version = "1.5", default-features = false, features = ["std"] }

[lints]
workspace = true
