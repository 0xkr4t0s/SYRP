[package]
name = "syrp-state"
description = "The Syrp state store: a slotmap node arena with interned identifiers, reference-counted handles, a change log and listener delivery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only OR BUSL-1.1"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.syrp]
layer = "L2"
wp = "WP-1.2-03"

[dependencies]
# Zlib licence (allowed by deny.toml). Generational arena keys (master plan §5.9).
slotmap = { version = "1.1.1", default-features = false, features = ["std"] }
syrp-error = { version = "0.0.1", path = "../../foundation/error" }
syrp-loop-api = { version = "0.0.1", path = "../../contracts/loop-api" }
syrp-var = { version = "0.0.1", path = "../var" }

[lints]
workspace = true
