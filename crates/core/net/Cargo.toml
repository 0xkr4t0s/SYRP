[package]
name = "syrp-net"
description = "Networking transport for Syrp: IP and MAC addresses, TCP and UDP sockets, named pipes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only OR BUSL-1.1"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.syrp]
layer = "L2"
wp = "WP-1.1-10"

[dependencies]
syrp-error = { version = "0.0.1", path = "../../foundation/error" }

[target.'cfg(any(unix, windows))'.dependencies]
socket2 = { version = "0.6.5", features = ["all"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.186", default-features = false }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
]

[dev-dependencies]
proptest = { version = "1.5", default-features = false, features = ["std"] }

[lints]
workspace = true
