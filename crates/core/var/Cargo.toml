[package]
name = "syrp-var"
description = "Dynamic values for Syrp: interned identifiers, the Var value type, named value sets, dynamic objects, JSON and XML."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only OR BUSL-1.1"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.syrp]
layer = "L2"
wp = "WP-1.1-01"

[features]
default = ["serde"]
# Public `Serialize`/`Deserialize` impls for `Var`. JSON works without it.
serde = []

[dependencies]
serde_core = { version = "1.0.229", default-features = false, features = ["std"] }
# The recursion limit is kept: never enable `unbounded_depth`.
serde_json = { version = "1.0.154", default-features = false, features = ["std", "float_roundtrip"] }
syrp-error = { version = "0.0.1", path = "../../foundation/error" }

[dev-dependencies]
proptest = { version = "1.5", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }

[lints]
workspace = true
