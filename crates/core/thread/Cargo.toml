[package]
name = "syrp-thread"
description = "Threading layer for Syrp: named threads with exit signalling, priorities, realtime scheduling, WaitableEvent, SpinLock and ThreadPool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only OR BUSL-1.1"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.syrp]
layer = "L2"
wp = "WP-1.1-06"

[dependencies]
syrp-error = { version = "0.0.1", path = "../../foundation/error" }
syrp-sys = { version = "0.0.1", path = "../sys" }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.186", default-features = false }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = ["Win32_Foundation", "Win32_System_Threading"]

# Only for `RUSTFLAGS="--cfg loom"` model-checking builds (see AGENTS.md).
[target.'cfg(loom)'.dependencies]
loom = "0.7.2"

[lints]
workspace = true
