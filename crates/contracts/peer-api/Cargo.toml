[package]
name = "syrp-peer-api"
description = "The Syrp native window contract: Desktop and Peer traits, input and IME events, and a headless peer for tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.syrp]
layer = "L1"
wp = "WP-0.2-08"

[dependencies]
syrp-error = { version = "0.0.1", path = "../../foundation/error" }
syrp-geom = { version = "0.0.1", path = "../../foundation/geom" }
syrp-gfx-api = { version = "0.0.1", path = "../gfx-api" }
syrp-loop-api = { version = "0.0.1", path = "../loop-api" }
keyboard-types = { version = "0.8.3", default-features = false, features = ["std"] }
raw-window-handle = { version = "0.6.2", default-features = false }

[lints]
workspace = true
