[package]
name = "syrp-gfx-api"
description = "The Syrp drawing contract: DisplayList, paths, strokes, brushes, image and font handles, RenderTarget and the Renderer trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.syrp]
layer = "L1"
wp = "WP-0.2-07"

[features]
# `serde::Serialize` for `DisplayList`: op-by-op JSON for inspection and golden debugging.
serde = ["dep:serde"]

[dependencies]
syrp-error = { version = "0.0.1", path = "../../foundation/error" }
syrp-geom = { version = "0.0.1", path = "../../foundation/geom" }
serde = { workspace = true, optional = true }

[dev-dependencies]
syrp-gfx-api = { version = "0.0.1", path = ".", features = ["serde"] }
serde_json.workspace = true

[lints]
workspace = true
