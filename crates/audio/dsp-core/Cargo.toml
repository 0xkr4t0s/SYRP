[package]
name = "syrp-dsp-core"
description = "Syrp DSP core: the processor model and chains, FFT, windowing, lookup tables and maths helpers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only OR BUSL-1.1"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.syrp]
layer = "L3"
wp = "WP-2.1-10"

[dependencies]
realfft = "3.5"
rustfft = "6.4"
syrp-audio-api = { version = "0.0.1", path = "../../contracts/audio-api" }
syrp-error = { version = "0.0.1", path = "../../foundation/error" }
syrp-rt = { version = "0.0.1", path = "../../foundation/rt" }
syrp-simd = { version = "0.0.1", path = "../../foundation/simd" }

[dev-dependencies]
syrp-testkit = { version = "0.0.1", path = "../../tooling/testkit" }

[[bench]]
name = "fft"
harness = false

[lints]
workspace = true
