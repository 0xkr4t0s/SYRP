[package]
name = "syrp-format-flac"
description = "FLAC audio files for Syrp: decoding with claxon and encoding with flacenc, behind the AudioFormat contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only OR BUSL-1.1"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.syrp]
layer = "L3"
wp = "WP-2.1-15"

[dependencies]
syrp-audio-api = { version = "0.0.1", path = "../../contracts/audio-api" }
syrp-error = { version = "0.0.1", path = "../../foundation/error" }
syrp-format-api = { version = "0.0.1", path = "../../contracts/format-api" }
claxon = "=0.4.3"

[dev-dependencies]
# Test streams only in this increment; the writer (B4) makes it a normal dependency.
flacenc = { version = "=0.5.1", default-features = false }

[lints]
workspace = true
