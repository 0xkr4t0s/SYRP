[package]
name = "syrp-audio-basics"
description = "Syrp audio basics: the owned AudioBuffer, vector operations, sample-format converters, control-rate DSP and the VoicePool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only OR BUSL-1.1"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.syrp]
layer = "L3"
wp = "WP-2.1-01"

[dependencies]
syrp-audio-api = { version = "0.0.1", path = "../../contracts/audio-api" }
syrp-error = { version = "0.0.1", path = "../../foundation/error" }
syrp-rt = { version = "0.0.1", path = "../../foundation/rt" }
syrp-simd = { version = "0.0.1", path = "../../foundation/simd" }

[dev-dependencies]
proptest = { version = "1.5", default-features = false, features = ["std"] }

[[bench]]
name = "buffer"
harness = false

[[bench]]
name = "control"
harness = false

[[bench]]
name = "voice_pool"
harness = false

[lints]
workspace = true
