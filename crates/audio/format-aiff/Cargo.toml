[package]
name = "syrp-format-aiff"
description = "Syrp AIFF and AIFF-C audio format: reading and writing with marker, instrument and text metadata."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only OR BUSL-1.1"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.syrp]
layer = "L3"
wp = "WP-2.1-17"

[dependencies]
syrp-audio-api = { version = "0.0.1", path = "../../contracts/audio-api" }
syrp-error = { version = "0.0.1", path = "../../foundation/error" }
syrp-format-api = { version = "0.0.1", path = "../../contracts/format-api" }

[dev-dependencies]
proptest = { version = "1.5", default-features = false, features = ["std"] }

[lints]
workspace = true
