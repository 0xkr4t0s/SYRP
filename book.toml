[book]
title = "Auricle"
description = "A Rust reimplementation of JUCE, built and used agent-first."
authors = ["The Auricle Authors"]
language = "en"
src = "docs"

[build]
build-dir = "target/site"
create-missing = false

[output.html]
git-repository-url = "https://github.com/0xkr4t0s/auricle"
edit-url-template = "https://github.com/0xkr4t0s/auricle/edit/main/{path}"

[output.html.search]
enable = true
