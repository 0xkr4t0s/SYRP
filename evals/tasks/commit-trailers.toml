id = "commit-trailers"
title = "Add provenance trailers to a commit"
prompt = """
The current directory is a git repository whose only commit lacks the provenance trailers the
Syrp merge gates require. Amend it (keeping its subject and content) so it ends with the trailers
for WP-0.2-13: `WP:`, `Spec: work/specs/WP-0.2-13.md` and `Agent-Model:`.
"""
setup = """
git init -q .
echo hello > a.txt
git add a.txt
git commit -q -m "[WP-0.2-13] demo: add a.txt"
"""
verify = """
test "$(git rev-list --count HEAD)" = 1
test -z "$(git status --porcelain)"
test "$(cat a.txt)" = hello
git log -1 --format=%B > msg.txt
head -n 1 msg.txt | grep -qx '\\[WP-0.2-13\\] demo: add a.txt'
grep -qx 'WP: WP-0.2-13' msg.txt
grep -qx 'Spec: work/specs/WP-0.2-13.md' msg.txt
grep -Eqx 'Agent-Model: .+' msg.txt
"""
reference = """
git commit -q --amend -m "[WP-0.2-13] demo: add a.txt" -m "WP: WP-0.2-13
Spec: work/specs/WP-0.2-13.md
Agent-Model: reference"
"""
