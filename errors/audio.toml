# Error catalogue: audio data contract (syrp-audio-api) and its users. Never renumber.

[[error]]
code = "SYRP-AUDIO-0001"
title = "Audio view frames exceed the channel stride"
severity = "error"
cause = "An AudioBlock or AudioBlockMut was asked for more frames per channel than the distance between channel starts, so channels would overlap."
fix = "Pass a stride of at least `frames` samples. Owning buffers round the stride up to a multiple of 64 bytes (16 f32 or 8 f64 samples)."

[[error]]
code = "SYRP-AUDIO-0002"
title = "Slice too short for the audio view's layout"
severity = "error"
cause = "The slice given to AudioBlock::new or AudioBlockMut::new holds fewer than `channels * stride` samples (or that product overflows usize)."
fix = "Allocate `channels * stride` samples, including the padding after the last channel, or build the view from fewer channels."

[[error]]
code = "SYRP-AUDIO-0003"
title = "Invalid sample rate"
severity = "error"
cause = "ProcessConfig::new was given a sample rate that is zero, negative, NaN or infinite."
fix = "Pass the device or host sample rate in Hz, for example 48000.0."

[[error]]
code = "SYRP-AUDIO-0004"
title = "Invalid maximum block size"
severity = "error"
cause = "ProcessConfig::new was given a maximum block size of zero frames."
fix = "Pass the largest number of frames a process call will receive, as reported by the device or host."

[[error]]
code = "SYRP-AUDIO-0005"
title = "Audio buffer too large"
severity = "error"
cause = "AudioBuffer::new, set_size or make_copy_of was asked for a shape whose padded size (channels times the 64-byte rounded stride) overflows usize, or whose size in bytes overflows isize."
fix = "Check the channel and frame counts: they usually come from a device, a host or a file header and may be corrupt. Real buffers are a few channels by at most a few million frames."

[[error]]
code = "SYRP-AUDIO-0006"
title = "Voice pool shape out of range"
severity = "error"
cause = "VoicePool::new was asked for more than 65536 voices (MAX_VOICES) or more than can be allocated, or VoicePool::prepare for more than 64 output channels, more than 1048576 frames (MAX_FRAMES), or a render scratch (output channels times maximum frames) that cannot be allocated."
fix = "Check the voice count, channel count and maximum block size: they usually come from a host or a preset. Real pools hold tens of voices and render a few channels of at most a few thousand frames."
