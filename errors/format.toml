# Error catalogue: audio file format contract (syrp-format-api) and the codecs. Never renumber.

[[error]]
code = "SYRP-FORMAT-0001"
title = "Audio file I/O failed"
severity = "error"
cause = "The stream under an audio reader or writer returned an I/O error while reading, writing, seeking, flushing or finishing."
fix = "Check that the file exists, is readable or writable, and that the disk is not full; the wrapped I/O error names the cause."

[[error]]
code = "SYRP-FORMAT-0002"
title = "Audio data does not match the format"
severity = "error"
cause = "The bytes given to an AudioFormat are not a valid file of that format: a wrong magic number, a truncated or inconsistent header, or a corrupt chunk."
fix = "Use AudioFormat::can_read on the header first, or try another format; if the file should be valid, it may be truncated or damaged."

[[error]]
code = "SYRP-FORMAT-0003"
title = "Audio format cannot handle this stream"
severity = "error"
cause = "The format does not support the requested sample rate, bit depth, sample kind, channel layout or feature."
fix = "Pick a value from AudioFormat::sample_rates and AudioFormat::bit_depths, or choose a format that supports it."

[[error]]
code = "SYRP-FORMAT-0004"
title = "Invalid audio stream description"
severity = "error"
cause = "AudioSpec::new was given a sample rate that is not finite and positive, a disabled or empty channel set, or a bit depth outside 1 to 32 for integers or other than 32 or 64 for floats."
fix = "Pass a real sample rate in Hz, at least one channel, and a bit depth the sample kind can hold."

[[error]]
code = "SYRP-FORMAT-0005"
title = "Block channel count differs from the writer's"
severity = "error"
cause = "AudioWriter::write was given a block whose channel count is not the channel count the writer was created with."
fix = "Write blocks with exactly AudioWriter::spec().channel_count() channels; slice or pad the block first."

[[error]]
code = "SYRP-FORMAT-0006"
title = "Not a WAV file"
severity = "error"
cause = "The input does not begin with a RIFF, RF64 or BW64 header whose form type is WAVE."
fix = "Check the file with AudioFormat::can_read before opening it, or use the format that matches its header."

[[error]]
code = "SYRP-FORMAT-0007"
title = "WAV chunk runs past the end of the input"
severity = "error"
cause = "A chunk the WAV reader needs (fmt or ds64) declares a size larger than the bytes left in the input; the file is truncated or its sizes are corrupt."
fix = "Re-copy or re-export the file; a truncated recording may be recoverable by a tool that rewrites its chunk sizes."

[[error]]
code = "SYRP-FORMAT-0008"
title = "WAV file is missing a required chunk"
severity = "error"
cause = "The WAV file has no 'fmt ' chunk describing its samples, or no 'data' chunk holding them."
fix = "The file is incomplete or not an audio WAV file; re-export it from its source."

[[error]]
code = "SYRP-FORMAT-0009"
title = "WAV format chunk holds impossible values"
severity = "error"
cause = "The 'fmt ' chunk is too short, or has zero channels, a zero sample rate, a block alignment that does not match the channels and sample size, a bit depth the encoding cannot have, or valid bits wider than the sample container."
fix = "The file header is corrupt; re-export the file from its source."

[[error]]
code = "SYRP-FORMAT-0010"
title = "WAV encoding is not supported"
severity = "error"
cause = "The WAV file uses a format tag or WAVE_FORMAT_EXTENSIBLE sub-format other than integer PCM or IEEE float, such as ADPCM or another compressed codec."
fix = "Convert the file to PCM or float WAV with another tool, or open it with a format that decodes that codec."

[[error]]
code = "SYRP-FORMAT-0011"
title = "WAV size needs more memory than is available"
severity = "error"
cause = "A count or size read from the WAV file needs an allocation that could not be reserved."
fix = "Free memory, or check that the file is not corrupt; sizes are checked against the input length first, so a valid file of this length needs this much."

[[error]]
code = "SYRP-FORMAT-0012"
title = "RF64 file has no valid ds64 chunk"
severity = "error"
cause = "An RF64 or BW64 file must carry a 'ds64' chunk with its 64-bit sizes as the first chunk; it is missing, too short, or its table runs past the chunk."
fix = "The file is corrupt or was not finished by its writer; re-export it."
