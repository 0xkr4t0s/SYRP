# Error catalogue: clean-room provenance and contamination scanning (master plan §10.9).
# Codes are permanent: never reuse or renumber one.

[[error]]
code = "SYRP-CR-0001"
title = "Similarity above the contamination threshold"
severity = "error"
cause = "A scanned file shares more winnowed fingerprints with the quarantined fingerprint database than the threshold allows."
fix = "Do not edit the code to dodge the scanner. The reviewer has the affected code re-implemented from the spec by a different agent (master plan §10.9)."

[[error]]
code = "SYRP-CR-0002"
title = "Fingerprint database unreadable or incompatible"
severity = "error"
cause = "The database file is missing, is not valid JSON, has the wrong schema, uses another normaliser, has k or w outside 1..=64, has no hashes (so it could never match), or holds a hash that is not 16 lowercase hex digits."
fix = "Regenerate it with the quarantined job using the same syrp-provenance normaliser. The format is documented in crates/tooling/provenance/src/database.rs."

[[error]]
code = "SYRP-CR-0003"
title = "Commit is missing a provenance trailer"
severity = "error"
cause = "A commit in the range has no `WP:` (or `Change-Request:`) trailer, or no `Agent-Model:` trailer, in its last paragraph."
fix = "Amend or reword the commit so its message ends with the trailers listed in AGENTS.md, then force-push the branch."

[[error]]
code = "SYRP-CR-0004"
title = "New source file lacks the crate's SPDX header"
severity = "error"
cause = "A `.rs` file added in the range does not start with `// SPDX-License-Identifier: <licence>` matching its crate's Cargo.toml `license`."
fix = "Make the file's first line the expected header shown in the diagnostic."

[[error]]
code = "SYRP-CR-0005"
title = "Git command failed"
severity = "error"
cause = "The provenance check could not run git, or the commit range does not resolve."
fix = "Run `git fetch origin main` and pass a range whose ends exist locally, e.g. origin/main..HEAD."

[[error]]
code = "SYRP-CR-0006"
title = "Crate licence could not be resolved"
severity = "error"
cause = "A crate's Cargo.toml is unreadable or has no `license` (or `license.workspace = true` with no workspace.package.license)."
fix = "Set `license.workspace = true` or an explicit SPDX expression in the crate's Cargo.toml."

[[error]]
code = "SYRP-CR-0007"
title = "File unreadable"
severity = "error"
cause = "A file to check or scan could not be read as UTF-8 text."
fix = "Check the path exists in the checked-out head commit and is UTF-8."
