# Error catalogue: pull requests and merge gates (master plan §12.8).

[[error]]
code = "AUR-PR-0001"
title = "PR too large"
severity = "error"
cause = "More than 1200 changed lines (Cargo.lock excluded). Large PRs get worse reviews."
fix = "Split the WP into several PRs; only the last carries `\"final\": true`."

[[error]]
code = "AUR-PR-0002"
title = "CI is red"
severity = "error"
cause = "At least one required check failed (gate G1)."
fix = "Reproduce locally with the same `cargo auricle` command the job ran, fix, and push."

[[error]]
code = "AUR-PR-0003"
title = "Reviewer requested changes"
severity = "error"
cause = "The `auricle/review` status is failure (gate G2)."
fix = "Address every requested change in the review comment; the conductor schedules a revision automatically."

[[error]]
code = "AUR-PR-0004"
title = "Adversarial verifier rejected the PR"
severity = "error"
cause = "The PR is high-risk (public API, unsafe, FFI, wrappers, licensing, CI, contracts or new dependencies) and the `auricle/adversarial` status is failure (gate G10)."
fix = "Address the verifier's findings; its attack tests usually show the failing case."

[[error]]
code = "AUR-PR-0005"
title = "PR front matter missing or invalid"
severity = "error"
cause = "The body must contain `<!-- auricle-pr: {json} -->` naming a known WP (or kind change-request)."
fix = "Use the PR template. Example: <!-- auricle-pr: {\"wp\":\"WP-0.1-03\",\"final\":true,\"risk\":[],\"deps_added\":[],\"unsafe_count\":0} -->"

[[error]]
code = "AUR-PR-0006"
title = "Provenance trailers missing"
severity = "error"
cause = "Every commit needs `WP: <id>` (or `Change-Request: <n>`) and `Agent-Model: <model>` trailers (master plan §10.5)."
fix = "Amend or reword the commits on your own branch to add the trailers, then force-push the branch."

[[error]]
code = "AUR-PR-0007"
title = "Review file invalid"
severity = "error"
cause = "The reviewer's JSON is malformed, skips a checklist item, passes an item without evidence, or lists no commands run."
fix = "Answer every item from `cargo auricle review checklist` with evidence from commands you ran yourself."
