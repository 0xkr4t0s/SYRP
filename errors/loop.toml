# Error catalogue: the message loop (syrp-loop-api and its implementations). Never renumber.

[[error]]
code = "SYRP-LOOP-0001"
title = "post_and_wait called on the message thread"
severity = "error"
cause = "post_and_wait blocks until the message thread has run the task. Called on the message thread itself it would wait for itself forever, so it fails instead."
fix = "On the message thread, call the code directly (you already hold a MessageThread token) or use post() to run it later."

[[error]]
code = "SYRP-LOOP-0002"
title = "ManualLoop task limit reached"
severity = "error"
cause = "run_until_idle ran as many tasks as its limit allows and the queue was still not empty. Usually a task re-posts itself, or two tasks post each other, forever."
fix = "Find the task that keeps posting work. If the work is legitimately long, raise the limit with ManualLoop::set_task_limit. The remaining tasks stay queued."

[[error]]
code = "SYRP-LOOP-0003"
title = "Message loop closed before the task ran"
severity = "error"
cause = "post_and_wait posted a task, but the loop was dropped (or the task panicked) before it produced a result."
fix = "Keep the loop alive and running while other threads wait on it, and check the task for panics."

[[error]]
code = "SYRP-LOOP-0004"
title = "A second EventLoop on one thread"
severity = "error"
cause = "EventLoop::new was called on a thread that already has an EventLoop. Each thread has at most one owned loop, because the loop is that thread's message thread."
fix = "Use the existing loop, or its task_sender() from other code. Drop the old loop first if you really want a new one."

[[error]]
code = "SYRP-LOOP-0005"
title = "The OS refused a call the loop needs"
severity = "error"
cause = "EventLoop::new needs a few OS objects (an epoll instance and an eventfd on Linux, run-loop sources and a kqueue on macOS, a window class and message-only window on Windows), and EventLoop::add_fd registers a file descriptor with epoll. The named OS call failed; the error carries the OS error number."
fix = "Read the OS error. Usually the process has run out of file descriptors or handles: close unused ones or raise the limit."

[[error]]
code = "SYRP-LOOP-0006"
title = "No owned message loop on this target"
severity = "error"
cause = "syrp-events has owned loops for Linux, macOS and Windows only. On iOS, Android and the web the platform owns the loop, and EventLoop::new returns this error."
fix = "Use the loop the platform or host provides (a hosted loop), or ManualLoop in tests."
