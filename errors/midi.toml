# Error catalogue: MIDI and UMP data types and codecs (syrp-midi). Never renumber.

[[error]]
code = "SYRP-MIDI-0001"
title = "Malformed MIDI message bytes"
severity = "error"
cause = "The bytes are not exactly one complete MIDI 1.0 message: they are empty, start with a data byte (running status is only allowed in byte streams), have the wrong length for their status, carry a data byte of 0x80 or above, a SysEx without its closing 0xF7, or a meta event whose length field disagrees with its data."
fix = "Pass one whole message, status byte first. Build messages with the MidiMessage constructors. Byte streams that use running status go through syrp_midi::BytesToUmp, which expands it."

[[error]]
code = "SYRP-MIDI-0002"
title = "MIDI value out of range"
severity = "error"
cause = "A constructor was given a channel outside 1 to 16, a 7-bit value above 127, or a 14-bit pitch-bend value above 16383."
fix = "Channels are numbered 1 to 16. Clamp or scale the value into range before building the message."


[[error]]
code = "SYRP-MIDI-0003"
title = "MidiBuffer or UmpBuffer capacity full"
severity = "error"
cause = "MidiBuffer::try_add_event and UmpBuffer::try_add never allocate, so they refuse an event when the buffer's event heads or its byte (or word) arena have no room left. The buffer is left unchanged."
fix = "Size the buffer for the worst case with MidiBuffer::with_capacity(events, bytes) (or UmpBuffer::with_capacity(events, words)) or reserve() off the audio thread, and clear() it every block. On the message thread, add_event (UmpBuffer::add) grows the buffer instead."

[[error]]
code = "SYRP-MIDI-0004"
title = "Malformed Universal MIDI Packet"
severity = "error"
cause = "UmpPacket::read was given fewer words than the packet's message type needs, or a field its message type constrains is invalid: a System status outside 0xF1..0xFF (or 0xF7), a MIDI 1.0 channel voice status outside 0x80..0xEF, a data byte of 0x80 or above, a SysEx7 byte count above 6, a SysEx8 byte count outside 1..14, or an undefined Data 64/128 status."
fix = "Read whole packets: the top four bits of the first word give the size (1, 2, 3 or 4 words). Build packets with the UmpPacket constructors, which check every field."
