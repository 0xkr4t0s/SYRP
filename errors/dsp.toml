# Error catalogue: DSP core and DSP processors (syrp-dsp-*). Never renumber.

[[error]]
code = "SYRP-DSP-0001"
title = "DSP buffer cannot be allocated"
severity = "error"
cause = "A DSP processor's prepare step asked for a buffer sized from the DspSpec (for example one processor per channel, or a scratch of max_block_size samples) and the allocation failed or its size overflowed."
fix = "Check the channel count and maximum block size in the DspSpec: they usually come from a host or device and may be corrupt. Real specs have a few channels and at most a few thousand frames per block."

[[error]]
code = "SYRP-DSP-0002"
title = "FFT order too large"
severity = "error"
cause = "Fft::new was asked for an order above Fft::MAX_ORDER (20, that is 1048576 points)."
fix = "Use a smaller order: spectrum displays and convolution use orders of about 8 to 16. Split longer signals into blocks."

[[error]]
code = "SYRP-DSP-0003"
title = "Invalid lookup table parameters"
severity = "error"
cause = "LookupTable::new or initialise was asked for fewer than 2 points, or LookupTableTransform::new, initialise or calculate_max_relative_error for an input range that is not finite or whose minimum is not below its maximum."
fix = "Use at least 2 points (typically 64 to 4096) and a finite range with min < max."

[[error]]
code = "SYRP-DSP-0004"
title = "Matrix data does not fit its shape"
severity = "error"
cause = "Matrix::from_row_major got a slice whose length is not rows * columns, Matrix::toeplitz a vector shorter than the size, or Matrix::hankel a vector shorter than offset + 2 * (size - 1) + 1."
fix = "Pass exactly rows * columns elements in row-major order, or a longer vector for the Toeplitz and Hankel builders."
