# Error catalogue: processor and plugin contract (syrp-plugin-api) and its users. Never renumber.

[[error]]
code = "SYRP-PLUGIN-0001"
title = "Duplicate parameter id"
severity = "error"
cause = "ParamLayout::register was given a ParamSpec whose string id is already registered in that layout. Ids must be unique within a processor because hosts store automation and state by them."
fix = "Give every parameter its own id. Keep ids stable across plugin versions; change the display name instead."

[[error]]
code = "SYRP-PLUGIN-0002"
title = "Invalid parameter spec"
severity = "error"
cause = "ParamLayout::register was given a ParamSpec with an empty id, a range that is not finite with start < end, a negative or non-finite step, a skew that is not finite and above zero (for example from with_centre outside the range), or a default value outside the range."
fix = "Check the range bounds, step and skew (ParamRange::is_valid reports them) and pass a default between the range start and end."

[[error]]
code = "SYRP-PLUGIN-0003"
title = "Audio-path allocation failed"
severity = "error"
cause = "Reserving memory for audio-path storage (such as the Params value array) failed, because the size overflows or the allocator refused."
fix = "Check the requested size; an overflow usually comes from a corrupt count. Allocate on the message thread or at prepare time, never on the audio thread."

[[error]]
code = "SYRP-PLUGIN-0004"
title = "Parameter change stream full"
severity = "error"
cause = "ParamChanges::try_push was called on a stream already holding as many changes as the capacity fixed at prepare time. try_push never allocates, so it refuses instead."
fix = "Ask for more room with PrepareCtx::reserve_param_changes, or thin out changes per block (keep the last change per parameter and offset)."

[[error]]
code = "SYRP-PLUGIN-0005"
title = "Double precision unsupported"
severity = "error"
cause = "prepare_processor was given a ProcessConfig with Precision::Double for a processor whose supports_double_precision returns false."
fix = "Prepare with Precision::Single, or implement f64 processing and return true from supports_double_precision."

[[error]]
code = "SYRP-PLUGIN-0006"
title = "Processor could not prepare"
severity = "error"
cause = "Processor::prepare reported that it cannot run at the given configuration, for example because a parameter it needs is not registered or the sample rate is out of its range."
fix = "Check the processor's documented sample rates and block sizes, and that register_params registered every id prepare resolves."

[[error]]
code = "SYRP-PLUGIN-0007"
title = "Editor could not be created"
severity = "error"
cause = "Editor::create could not build its UI, for example because a parameter it attaches to is not registered or a resource failed to load."
fix = "Check that every id the editor resolves through ParamHandles::index_of is registered, and that its resources ship with the plugin."

[[error]]
code = "SYRP-PLUGIN-0008"
title = "Editor unsupported by host"
severity = "error"
cause = "Editor::create was given an EditorHost it cannot build into, for example a headless host or a runtime whose UI type the editor does not recognise."
fix = "Run the plugin headless without an editor, or open it in a host that provides the syrp-plugin UI runtime."

[[error]]
code = "SYRP-PLUGIN-0009"
title = "Invalid plugin descriptor"
severity = "error"
cause = "PluginDescriptor::validate found an empty name or vendor, no format id, or an id with the wrong shape (VST3 needs 32 hex digits, Audio Unit four printable ASCII characters, others no whitespace)."
fix = "Set the name, vendor and an id for every format the plugin ships in, in that format's shape."

[[error]]
code = "SYRP-PLUGIN-0010"
title = "Malformed plugin state"
severity = "error"
cause = "A state blob is not a StateEnvelope (wrong magic, truncated, extra bytes, nonzero reserved field), or PluginState::load_state rejected its payload."
fix = "Load only blobs that save_state produced. If a host stored a foreign chunk, convert it before loading."

[[error]]
code = "SYRP-PLUGIN-0011"
title = "Plugin state from a newer version"
severity = "error"
cause = "The blob's state version is above the plugin's PluginState::state_version, or its envelope format is newer than this build reads. The plugin was not called."
fix = "Update the plugin to a version that understands the saved state."
