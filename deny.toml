# SHARED FILE. Supply-chain and licence policy (merge gate G5).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "MPL-2.0", "BSL-1.0",
]
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Clean room (master plan §10.9): crates named `aloe-*` (self-described JUCE translations)
# are rejected by `cargo syrp check` (SYRP-CLI-0204), since cargo-deny bans take exact names.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
