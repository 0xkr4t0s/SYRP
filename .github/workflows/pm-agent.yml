# SHARED FILE (PR manager). The PR-manager agent: rebases conflicts and triages red CI.
# Dispatched only by pr-manager.yml.
name: pm-agent

on:
  workflow_dispatch:
    inputs:
      pr: { description: "PR number", required: true }
      task: { description: "conflict | ci-triage", required: true }

concurrency:
  group: pm-agent-${{ inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The agent rebases and triages only; merging stays with the deterministic gate job,
      # so it gets the implementer token (no statuses, no merge).
      GH_TOKEN: ${{ secrets.SYRP_IMPLEMENTER_TOKEN }}
      GH_REPO: ${{ github.repository }}
      MODEL: ${{ vars.SYRP_PR_MANAGER_MODEL || 'claude-opus-5-5' }}
      PR: ${{ inputs.pr }}
      TASK: ${{ inputs.task }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYRP_IMPLEMENTER_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: |
          git config user.name "syrp-bot"
          git config user.email "syrp-bot@users.noreply.github.com"
      - id: prompt
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "bad pr"; exit 1; }
          [[ "$TASK" =~ ^(conflict|ci-triage)$ ]] || { echo "bad task"; exit 1; }
          {
            echo 'text<<PROMPT_EOF'
            agents/render.sh roles/pr-manager.md PR="$PR" TASK="$TASK" MODEL="$MODEL"
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.SYRP_IMPLEMENTER_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model ${{ env.MODEL }}
            --max-turns 120
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
      - name: Clear the in-flight label
        if: always() && inputs.task == 'conflict'
        run: gh pr edit "$PR" --remove-label pm:rebasing || true
