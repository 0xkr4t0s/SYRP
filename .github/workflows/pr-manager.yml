# SHARED FILE (PR manager). Deterministic merge gates for every open PR (master plan §12.8).
# Merges when all gates pass; dispatches the PR-manager agent for conflicts and red CI.
name: pr-manager

on:
  workflow_run:
    workflows: [ci, reviewer]
    types: [completed]
  status:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: pr-manager
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  gates:
    if: vars.SYRP_PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    env:
      # The bot token merges, so the push to main triggers CI and the conductor.
      GH_TOKEN: ${{ secrets.SYRP_BOT_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --quiet -p syrp-cli
      - name: Evaluate and act
        run: |
          set -uo pipefail
          gh label create ci-triaged --force >/dev/null
          gh label create pm:rebasing --force >/dev/null
          for pr in $(gh pr list --state open --limit 200 --json number,isDraft --jq '.[] | select(.isDraft|not) | .number'); do
            gh pr view "$pr" --json number,headRefOid,body,labels,files,commits,statusCheckRollup,mergeable,isDraft > pr.json
            cargo syrp pr gates --pr pr.json --json > gates.json
            verdict="$(jq -r '.results[0].verdict' gates.json)"
            labels="$(jq -r '.labels[].name' pr.json)"
            echo "::group::PR #$pr: $verdict"; jq -c '.results[0].gates[]' gates.json; echo "::endgroup::"
            # Label derived risks so humans and the reviewer see them.
            for r in $(jq -r '.results[0].risks[]' gates.json); do
              gh label create "risk:$r" --force >/dev/null; gh pr edit "$pr" --add-label "risk:$r" >/dev/null
            done
            case "$verdict" in
              merge)
                # Merge exactly the head the gates evaluated; a newer push fails the merge.
                if ! gh pr merge "$pr" --squash --delete-branch --match-head-commit "$(jq -r .headRefOid pr.json)"; then
                  # Usually "branch is behind": bring it up to date; CI and review rerun.
                  gh pr update-branch "$pr" --rebase || true
                fi
                ;;
              conflict)
                if ! grep -qx pm:rebasing <<<"$labels"; then
                  gh pr edit "$pr" --add-label pm:rebasing
                  gh workflow run pm-agent.yml -f pr="$pr" -f task=conflict
                fi
                ;;
              block)
                ci_failed="$(jq -r '.results[0].gates[] | select(.gate=="G1-ci" and .state=="fail") | .gate' gates.json)"
                if [ -n "$ci_failed" ] && ! grep -qx ci-triaged <<<"$labels"; then
                  gh pr edit "$pr" --add-label ci-triaged
                  gh workflow run pm-agent.yml -f pr="$pr" -f task=ci-triage
                fi
                ;;
            esac
          done
