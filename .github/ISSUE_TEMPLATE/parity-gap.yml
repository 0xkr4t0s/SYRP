    id: ledger
    attributes:
      label: Ledger row
      placeholder: juce_gui_basics/Slider
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed difference
      description: Scenario, Syrp output, reference output. Public docs or harness output only.
    validations:
      required: true
